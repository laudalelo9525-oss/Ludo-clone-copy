name: LudoVerse CI

on:
  push:
    branches: [ "main", "Code" ]
  pull_request:
    branches: [ "main", "Code" ]

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
